name: 功能建议
description: 提议新功能、设备支持或现有体验改进。
title: "[Feature] "
labels: [enhancement]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，没有发现相同建议。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述谁在什么场景下遇到什么困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明希望应用怎样工作，以及怎样判断功能有效。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前怎样处理这个问题，或有哪些其他可行方式？
  - type: textarea
    id: compatibility
    attributes:
      label: 设备与兼容性
      description: 新增设备支持请写出型号、屏幕规格、系统/固件版本、蓝牙能力和可验证的设备；未知项请说明。
  - type: textarea
    id: context
    attributes:
      label: 补充资料
      description: 可提供脱敏截图、示例或公开资料链接。
